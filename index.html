<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>De yo, para tu 🌻💛</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: linear-gradient(180deg, #fff9d9, #fffdf1);
      font-family: Georgia, serif;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #5c4a1f;
    }

    .card {
      width: 90%;
      max-width: 500px;
      padding: 30px 25px;
      text-align: center;
      background: rgba(255,255,255,0.78);
      border-radius: 30px;
      box-shadow: 0 10px 40px rgba(150,120,20,0.15);
      backdrop-filter: blur(8px);
      z-index: 2;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 2.4rem;
      color: #c89b00;
    }

    .message {
      font-size: 1.15rem;
      line-height: 1.7;
      margin-bottom: 10px;
    }

    .signature {
      font-size: 1.1rem;
      font-style: italic;
      margin-top: 15px;
    }

    /* =========================
       RAMO
    ========================= */

    .bouquet {
      position: relative;
      width: 300px;
      height: 290px;
      margin: 0 auto 5px;
    }

    /* Tallitos */
    .stem {
      position: absolute;
      width: 7px;
      height: 145px;
      background: linear-gradient(
        to right,
        #4f8c2f,
        #78ae3d,
        #4f8c2f
      );
      bottom: 10px;
      left: 50%;
      transform-origin: bottom;
      border-radius: 10px;
      z-index: 1;
    }

    .stem.one {
      transform: rotate(-22deg);
      height: 155px;
    }

    .stem.two {
      transform: rotate(-10deg);
      height: 170px;
    }

    .stem.three {
      transform: rotate(7deg);
      height: 175px;
    }

    .stem.four {
      transform: rotate(20deg);
      height: 150px;
    }

    .stem.five {
      transform: rotate(0deg);
      height: 180px;
    }

    /* =========================
       HOJAS
    ========================= */

    .leaf {
      position: absolute;
      width: 55px;
      height: 25px;
      background: linear-gradient(
        135deg,
        #79ad3e,
        #4f8d2f
      );
      border-radius: 100% 0 100% 0;
      z-index: 2;
    }

    .leaf.l1 {
      left: 65px;
      bottom: 65px;
      transform: rotate(-28deg);
    }

    .leaf.l2 {
      right: 65px;
      bottom: 80px;
      transform: scaleX(-1) rotate(-28deg);
    }

    .leaf.l3 {
      left: 105px;
      bottom: 105px;
      transform: rotate(-12deg);
    }

    .leaf.l4 {
      right: 100px;
      bottom: 105px;
      transform: scaleX(-1) rotate(-12deg);
    }

    /* =========================
       GIRASOLES
    ========================= */

    .sunflower {
      position: absolute;
      width: 105px;
      height: 105px;
      z-index: 3;
      animation: float 3.5s ease-in-out infinite;
    }

    .sunflower.small {
      width: 85px;
      height: 85px;
    }

    .sunflower.large {
      width: 115px;
      height: 115px;
    }

    /* Posiciones */

    .s1 {
      left: 25px;
      top: 55px;
      animation-delay: -1s;
    }

    .s2 {
      left: 95px;
      top: 10px;
      animation-delay: -2s;
    }

    .s3 {
      right: 20px;
      top: 55px;
      animation-delay: -0.5s;
    }

    .s4 {
      left: 55px;
      top: 105px;
      animation-delay: -1.5s;
    }

    .s5 {
      right: 60px;
      top: 105px;
      animation-delay: -2.5s;
    }

    /* Pétalos */

    .petals {
      position: absolute;
      inset: 0;
    }

    .petal {
      position: absolute;
      width: 30%;
      height: 48%;
      left: 35%;
      top: 1%;
      background: linear-gradient(
        180deg,
        #ffe45c,
        #ffc928
      );
      border-radius: 50% 50% 45% 45%;
      transform-origin: 50% 100%;
      box-shadow:
        inset 2px 0 #ffe978,
        inset -3px 0 #f5b91f;
    }

    .petal:nth-child(1) {
      transform: rotate(0deg);
    }

    .petal:nth-child(2) {
      transform: rotate(45deg);
    }

    .petal:nth-child(3) {
      transform: rotate(90deg);
    }

    .petal:nth-child(4) {
      transform: rotate(135deg);
    }

    .petal:nth-child(5) {
      transform: rotate(180deg);
    }

    .petal:nth-child(6) {
      transform: rotate(225deg);
    }

    .petal:nth-child(7) {
      transform: rotate(270deg);
    }

    .petal:nth-child(8) {
      transform: rotate(315deg);
    }

    /* Centro del girasol */

    .center {
      position: absolute;
      width: 40%;
      height: 40%;
      left: 30%;
      top: 30%;
      border-radius: 50%;
      background:
        radial-gradient(
          circle at 35% 35%,
          #8f5b19 0 7%,
          transparent 8%
        ),
        radial-gradient(
          circle at 65% 30%,
          #6e4215 0 6%,
          transparent 7%
        ),
        radial-gradient(
          circle at 40% 70%,
          #704415 0 6%,
          transparent 7%
        ),
        radial-gradient(
          circle at 70% 65%,
          #98631e 0 7%,
          transparent 8%
        ),
        #704515;
      box-shadow:
        inset 0 0 0 4px #5b3814,
        0 2px 5px rgba(80,50,10,0.3);
      z-index: 5;
    }

    /* =========================
       PAPEL DEL RAMO
    ========================= */

    .paper {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 180px;
      height: 105px;
      background: linear-gradient(
        135deg,
        #fff4c7,
        #f5d985
      );
      clip-path: polygon(
        15% 0,
        85% 0,
        100% 100%,
        50% 78%,
        0 100%
      );
      z-index: 6;
      box-shadow: 0 5px 15px rgba(100,70,10,0.15);
    }

    .ribbon {
      position: absolute;
      bottom: 52px;
      left: 50%;
      transform: translateX(-50%);
      width: 75px;
      height: 16px;
      background: #e4b51e;
      border-radius: 10px;
      z-index: 7;
      box-shadow: 0 3px 5px rgba(100,70,10,0.15);
    }

    .ribbon::before,
    .ribbon::after {
      content: "";
      position: absolute;
      top: 8px;
      width: 40px;
      height: 45px;
      background: #e4b51e;
      z-index: -1;
    }

    .ribbon::before {
      right: 45px;
      transform: rotate(25deg);
      border-radius: 5px 5px 20px 5px;
    }

    .ribbon::after {
      left: 45px;
      transform: rotate(-25deg);
      border-radius: 5px 5px 5px 20px;
    }

    /* =========================
       ANIMACIÓN
    ========================= */

    @keyframes float {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-7px) rotate(1.5deg);
      }
    }

    /* =========================
       FLORECITAS ALREDEDOR
    ========================= */

    .sparkle {
      position: absolute;
      color: #e4b51e;
      font-size: 18px;
      animation: sparkle 2s ease-in-out infinite;
      opacity: 0.7;
    }

    .sp1 {
      top: 25px;
      left: 5px;
    }

    .sp2 {
      top: 15px;
      right: 5px;
      animation-delay: .7s;
    }

    .sp3 {
      bottom: 75px;
      left: 25px;
      animation-delay: 1.2s;
    }

    .sp4 {
      bottom: 70px;
      right: 25px;
      animation-delay: .4s;
    }

    @keyframes sparkle {
      0%, 100% {
        transform: scale(1);
        opacity: .5;
      }

      50% {
        transform: scale(1.3);
        opacity: 1;
      }
    }

    /* =========================
       CELULARES
    ========================= */

    @media (max-width: 450px) {
      .card {
        padding: 25px 18px;
      }

      h1 {
        font-size: 2rem;
      }

      .message {
        font-size: 1.05rem;
      }

      .bouquet {
        transform: scale(.9);
        margin-top: -5px;
        margin-bottom: -10px;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="bouquet">

      <!-- Tallos -->
      <div class="stem one"></div>
      <div class="stem two"></div>
      <div class="stem three"></div>
      <div class="stem four"></div>
      <div class="stem five"></div>

      <!-- Hojas -->
      <div class="leaf l1"></div>
      <div class="leaf l2"></div>
      <div class="leaf l3"></div>
      <div class="leaf l4"></div>

      <!-- Girasol 1 -->
      <div class="sunflower small s1">
        <div class="petals">
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
        </div>
        <div class="center"></div>
      </div>

      <!-- Girasol 2 -->
      <div class="sunflower large s2">
        <div class="petals">
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
        </div>
        <div class="center"></div>
      </div>

      <!-- Girasol 3 -->
      <div class="sunflower small s3">
        <div class="petals">
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
        </div>
        <div class="center"></div>
      </div>

      <!-- Girasol 4 -->
      <div class="sunflower small s4">
        <div class="petals">
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
        </div>
        <div class="center"></div>
      </div>

      <!-- Girasol 5 -->
      <div class="sunflower small s5">
        <div class="petals">
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
        </div>
        <div class="center"></div>
      </div>

      <!-- Papel -->
      <div class="paper"></div>
      <div class="ribbon"></div>

      <!-- Brillitos -->
      <div class="sparkle sp1">✦</div>
      <div class="sparkle sp2">✦</div>
      <div class="sparkle sp3">✧</div>
      <div class="sparkle sp4">✧</div>

    </div>

    <h1>Para ti 🌻💛</h1>

    <div class="message">
      Un pequeño ramo de flores amarillas
      para recordarte lo especial que eres.
    </div>

    <div class="signature">
      Te quiere mucho 💛<br>
      Att: Tu bestia
    </div>

  </div>

</body>
</html>
