<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>De yo, para tu🌷💛</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: linear-gradient(180deg, #fff9d9, #fffdf1);
      font-family: Georgia, serif;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #5c4a1f;
    }

    .card {
      width: 90%;
      max-width: 500px;
      padding: 35px 25px;
      text-align: center;
      background: rgba(255,255,255,0.75);
      border-radius: 30px;
      box-shadow: 0 10px 40px rgba(150,120,20,0.15);
      backdrop-filter: blur(8px);
      z-index: 2;
    }

    h1 {
      margin: 0 0 15px;
      font-size: 2.4rem;
      color: #c89b00;
    }

    .message {
      font-size: 1.15rem;
      line-height: 1.7;
      margin-bottom: 20px;
    }

    .signature {
      font-size: 1.1rem;
      font-style: italic;
      margin-top: 20px;
    }

    /* RAMO */
    .bouquet {
      position: relative;
      width: 280px;
      height: 280px;
      margin: 0 auto 15px;
    }

    .tulip {
      position: absolute;
      width: 65px;
      height: 80px;
      animation: float 3s ease-in-out infinite;
    }

    .flower {
      position: absolute;
      width: 55px;
      height: 50px;
      background: #ffd92f;
      border-radius: 50% 50% 45% 45%;
      top: 0;
      left: 5px;
      box-shadow:
        inset 8px 0 #f6c928,
        inset -8px 0 #ffe866;
    }

    .flower::before {
      content: "";
      position: absolute;
      width: 30px;
      height: 45px;
      background: #ffd92f;
      left: 12px;
      top: -10px;
      border-radius: 50% 50% 30% 30%;
    }

    .stem {
      position: absolute;
      width: 7px;
      height: 115px;
      background: #6fa33a;
      left: 30px;
      top: 42px;
      border-radius: 10px;
      transform-origin: top;
    }

    .leaf {
      position: absolute;
      width: 35px;
      height: 16px;
      background: #78ad3b;
      border-radius: 100% 0 100% 0;
      top: 105px;
      left: 4px;
      transform: rotate(-30deg);
    }

    .t1 { left: 105px; top: 20px; transform: rotate(-10deg); }
    .t2 { left: 55px; top: 55px; transform: rotate(-20deg); animation-delay: .4s; }
    .t3 { left: 150px; top: 45px; transform: rotate(15deg); animation-delay: .8s; }
    .t4 { left: 95px; top: 85px; transform: rotate(5deg); animation-delay: 1.2s; }
    .t5 { left: 185px; top: 80px; transform: rotate(20deg); animation-delay: 1.6s; }
    .t6 { left: 35px; top: 105px; transform: rotate(-25deg); animation-delay: 2s; }
    .t7 { left: 150px; top: 110px; transform: rotate(15deg); animation-delay: 2.4s; }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) rotate(var(--r, 0deg));
      }

      50% {
        transform: translateY(-8px) rotate(var(--r, 0deg));
      }
    }

    /* PÉTALOS */
    .petal {
      position: fixed;
      top: -30px;
      width: 15px;
      height: 22px;
      background: #ffd92f;
      border-radius: 50% 50% 50% 0;
      transform: rotate(45deg);
      opacity: .7;
      animation: fall linear infinite;
    }

    .p1 { left: 8%; animation-duration: 7s; animation-delay: 0s; }
    .p2 { left: 25%; animation-duration: 9s; animation-delay: 2s; }
    .p3 { left: 48%; animation-duration: 8s; animation-delay: 1s; }
    .p4 { left: 70%; animation-duration: 10s; animation-delay: 3s; }
    .p5 { left: 90%; animation-duration: 7s; animation-delay: 4s; }

    @keyframes fall {
      from {
        transform: translateY(-30px) rotate(0deg);
      }

      to {
        transform: translateY(110vh) rotate(360deg);
      }
    }

    @media (max-width: 400px) {
      h1 {
        font-size: 2rem;
      }

      .message {
        font-size: 1rem;
      }

      .bouquet {
        transform: scale(.85);
        margin-top: -10px;
        margin-bottom: -15px;
      }
    }
  </style>
</head>

<body>

  <!-- Pétalos -->
  <div class="petal p1"></div>
  <div class="petal p2"></div>
  <div class="petal p3"></div>
  <div class="petal p4"></div>
  <div class="petal p5"></div>

  <div class="card">

    <div class="bouquet">

      <div class="tulip t1">
        <div class="flower"></div>
        <div class="stem"></div>
        <div class="leaf"></div>
      </div>

      <div class="tulip t2">
        <div class="flower"></div>
        <div class="stem"></div>
        <div class="leaf"></div>
      </div>

      <div class="tulip t3">
        <div class="flower"></div>
        <div class="stem"></div>
        <div class="leaf"></div>
      </div>

      <div class="tulip t4">
        <div class="flower"></div>
        <div class="stem"></div>
        <div class="leaf"></div>
      </div>

      <div class="tulip t5">
        <div class="flower"></div>
        <div class="stem"></div>
        <div class="leaf"></div>
      </div>

      <div class="tulip t6">
        <div class="flower"></div>
        <div class="stem"></div>
        <div class="leaf"></div>
      </div>

      <div class="tulip t7">
        <div class="flower"></div>
        <div class="stem"></div>
        <div class="leaf"></div>
      </div>

    </div>

    <h1>Para ti 🌷</h1>

    <div class="message">
      Un pequeño detalle para recordarte
      lo especial que eres para mí. 💛
      <br><br>
      Espero que estas flores te saquen
      una sonrisa, aunque sea pequeñita.
    </div>

    <div class="signature">
      Te quiere mucho,<br>
      <strong>Att: Tu bestia 💛</strong>
    </div>

  </div>

</body>
</html>
